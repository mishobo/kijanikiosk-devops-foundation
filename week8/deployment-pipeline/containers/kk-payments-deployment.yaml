apiVersion: apps/v1
kind: Deployment
metadata:
  name: kk-payments
  labels:
    app: kk-payments
spec:
  # A payments service never runs a single replica: one Pod restarting
  # must not mean an outage.
  replicas: 2
  selector:
    matchLabels:
      app: kk-payments
  template:
    metadata:
      labels:
        app: kk-payments
    spec:
      imagePullSecrets:
        - name: kijani-registry-credentials
      containers:
        - name: kk-payments
          # Tag pushed in Requirement 7 (VERSION-GITSHA, computed at build
          # time). Must match registry-push.txt character for character.
          image: host.minikube.internal:5001/kk-payments:0.1.0-2e3e50e
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: APP_VERSION
              value: "0.1.0-2e3e50e"
            - name: DEPLOY_ENV
              value: "kubernetes"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
