# KijaniKiosk payments proxy. The active upstream is defined in
# /etc/nginx/kijanikiosk-active-env.conf and rewritten by switch-env.sh.
include /etc/nginx/kijanikiosk-active-env.conf;

server {
    listen 80 default_server;
    server_name _;

    location / {
        proxy_pass http://kk_api_active;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_next_upstream off;
    }
}
