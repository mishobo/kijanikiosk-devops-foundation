<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="36" text-anchor="middle" font-size="24" font-weight="bold" fill="#111">KijaniKiosk Capstone — Track A: Infrastructure-First</text>
  <text x="700" y="58" text-anchor="middle" font-size="13" fill="#555">kk-payments multi-environment delivery + Week 10 receipt chain integration</text>

  <!-- Layer labels -->
  <text x="30" y="100" font-size="13" font-weight="bold" fill="#888">INFRASTRUCTURE</text>
  <text x="30" y="330" font-size="13" font-weight="bold" fill="#888">DELIVERY</text>
  <text x="30" y="470" font-size="13" font-weight="bold" fill="#888">RUNTIME</text>
  <text x="30" y="700" font-size="13" font-weight="bold" fill="#888">INTELLIGENCE / OBSERVABILITY</text>

  <!-- Terraform -->
  <rect x="60" y="110" width="180" height="70" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="150" y="140" text-anchor="middle" font-size="14" font-weight="bold">Terraform</text>
  <text x="150" y="160" text-anchor="middle" font-size="11">provisions namespace</text>

  <!-- Ansible -->
  <rect x="300" y="110" width="180" height="70" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="390" y="140" text-anchor="middle" font-size="14" font-weight="bold">Ansible</text>
  <text x="390" y="160" text-anchor="middle" font-size="11">configures ConfigMap</text>

  <!-- kijani-staging namespace -->
  <rect x="540" y="100" width="220" height="90" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="650" y="130" text-anchor="middle" font-size="14" font-weight="bold">kijani-staging</text>
  <text x="650" y="150" text-anchor="middle" font-size="11">namespace (isolated)</text>
  <text x="650" y="167" text-anchor="middle" font-size="11">DB_HOST=...staging.svc</text>

  <!-- kijani-project namespace -->
  <rect x="820" y="100" width="220" height="90" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="930" y="130" text-anchor="middle" font-size="14" font-weight="bold">kijani-project</text>
  <text x="930" y="150" text-anchor="middle" font-size="11">namespace (production)</text>
  <text x="930" y="167" text-anchor="middle" font-size="11">pre-existing, Week 9</text>

  <line x1="240" y1="145" x2="300" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="138" text-anchor="middle" font-size="10">terraform apply</text>
  <line x1="480" y1="145" x2="540" y2="145" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="510" y="138" text-anchor="middle" font-size="10">k8s_info /</text>
  <text x="510" y="150" text-anchor="middle" font-size="10">k8s apply</text>

  <!-- Jenkins -->
  <rect x="60" y="330" width="1180" height="90" rx="8" fill="#e6f4ea" stroke="#34a853" stroke-width="2"/>
  <text x="650" y="360" text-anchor="middle" font-size="14" font-weight="bold">Jenkins pipeline (merge to main)</text>
  <text x="650" y="380" text-anchor="middle" font-size="11">build image → terraform apply → ansible-playbook → deploy staging → smoke test → [approval gate: reason recorded] → deploy production</text>

  <line x1="650" y1="190" x2="650" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="260" font-size="10">kubectl apply -f k8s/*.yaml -n kijani-staging</text>
  <line x1="930" y1="190" x2="930" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="940" y="260" font-size="10">kubectl apply -f k8s/*.yaml -n kijani-project</text>
  <text x="940" y="274" font-size="10">(only after approval gate)</text>

  <!-- kk-payments staging -->
  <rect x="380" y="470" width="220" height="80" rx="8" fill="#fef7e0" stroke="#f9ab00" stroke-width="2"/>
  <text x="490" y="498" text-anchor="middle" font-size="14" font-weight="bold">kk-payments</text>
  <text x="490" y="516" text-anchor="middle" font-size="11">staging Deployment (3 replicas)</text>
  <text x="490" y="532" text-anchor="middle" font-size="11">probes, limits, ConfigMap+Secret</text>

  <!-- kk-payments prod -->
  <rect x="700" y="470" width="220" height="80" rx="8" fill="#fce8e6" stroke="#ea4335" stroke-width="2"/>
  <text x="810" y="498" text-anchor="middle" font-size="14" font-weight="bold">kk-payments</text>
  <text x="810" y="516" text-anchor="middle" font-size="11">production Deployment (3 replicas)</text>
  <text x="810" y="532" text-anchor="middle" font-size="11">same manifest, prod ConfigMap</text>

  <line x1="650" y1="420" x2="490" y2="470" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="420" x2="810" y2="470" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="875" y="450" font-size="10">kubectl set image + rollout status</text>

  <!-- S3 receipts bucket -->
  <rect x="380" y="600" width="220" height="70" rx="8" fill="#f3e8fd" stroke="#a142f4" stroke-width="2"/>
  <text x="490" y="628" text-anchor="middle" font-size="14" font-weight="bold">kijani-payments-receipts-staging</text>
  <text x="490" y="648" text-anchor="middle" font-size="11">S3 bucket (local mock)</text>

  <line x1="490" y1="550" x2="490" y2="600" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="580" font-size="10">POST /pay → PutObject (receipt JSON)</text>

  <!-- serverless chain -->
  <rect x="60" y="700" width="200" height="70" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="160" y="728" text-anchor="middle" font-size="13" font-weight="bold">kk-receipts</text>
  <text x="160" y="746" text-anchor="middle" font-size="10">S3 trigger, validates</text>

  <rect x="300" y="700" width="200" height="70" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="400" y="728" text-anchor="middle" font-size="13" font-weight="bold">kk-processor</text>
  <text x="400" y="746" text-anchor="middle" font-size="10">S3 trigger, adds tax line</text>

  <rect x="540" y="700" width="200" height="70" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="2"/>
  <text x="640" y="728" text-anchor="middle" font-size="13" font-weight="bold">kk-notifier</text>
  <text x="640" y="746" text-anchor="middle" font-size="10">S3 trigger, logs summary</text>

  <line x1="490" y1="670" x2="490" y2="690" stroke="#333" stroke-width="2"/>
  <line x1="490" y1="690" x2="160" y2="700" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="685" font-size="10">S3 ObjectCreated event</text>
  <line x1="260" y1="735" x2="300" y2="735" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="280" y="720" text-anchor="middle" font-size="9">S3 event</text>
  <line x1="500" y1="735" x2="540" y2="735" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="720" text-anchor="middle" font-size="9">S3 event</text>

  <!-- monitoring -->
  <rect x="800" y="700" width="260" height="90" rx="8" fill="#fde7e9" stroke="#c5221f" stroke-width="2"/>
  <text x="930" y="726" text-anchor="middle" font-size="13" font-weight="bold">monitoring/error-rate.js</text>
  <text x="930" y="744" text-anchor="middle" font-size="10">reads kk-payments structured logs</text>
  <text x="930" y="760" text-anchor="middle" font-size="10">alerts if 5xx rate &gt; 5% over 2 min</text>
  <text x="930" y="776" text-anchor="middle" font-size="10">gates the Jenkins approval stage</text>

  <line x1="810" y1="550" x2="930" y2="700" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="960" y="630" font-size="10">kubectl logs (JSON lines)</text>

  <!-- legend -->
  <rect x="1090" y="700" width="14" height="14" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="1110" y="712" font-size="11">Terraform / Serverless (config-as-code)</text>
  <rect x="1090" y="722" width="14" height="14" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="1110" y="734" font-size="11">Staging environment</text>
  <rect x="1090" y="744" width="14" height="14" fill="#fce8e6" stroke="#ea4335"/>
  <text x="1110" y="756" font-size="11">Production environment</text>
  <rect x="1090" y="766" width="14" height="14" fill="#e6f4ea" stroke="#34a853"/>
  <text x="1110" y="778" font-size="11">Jenkins pipeline</text>
  <rect x="1090" y="788" width="14" height="14" fill="#fde7e9" stroke="#c5221f"/>
  <text x="1110" y="800" font-size="11">Observability</text>
</svg>
