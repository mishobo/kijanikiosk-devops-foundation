# Production ConfigMap. Applied to the kijani-project namespace. Staging
# uses kk-payments-configmap-staging.yaml (rendered by ansible/playbook.yml
# from the same template) instead — same keys, different values, per
# project.md's "environment-specific ConfigMaps" requirement.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kk-payments-config
  namespace: kijani-project
  labels:
    app: kk-payments
    environment: production
data:
  NODE_ENV: "production"
  DB_HOST: "kk-postgres.kijani-project.svc.cluster.local"
  DB_PORT: "5432"
  LOG_LEVEL: "info"
  APP_PORT: "3001"
  MAX_CONNECTIONS: "50"
  RECEIPTS_BUCKET: "kijani-payments-receipts-production"
  S3_LOCAL_ROOT: "/tmp/kijani-s3-local"
