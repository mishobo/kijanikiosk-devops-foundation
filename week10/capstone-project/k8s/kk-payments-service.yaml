# Namespace omitted — see kk-payments-deployment.yaml. Applied with
# `kubectl apply -f k8s/kk-payments-service.yaml -n <namespace>`.
apiVersion: v1
kind: Service
metadata:
  name: kk-payments
  labels:
    app: kk-payments
spec:
  type: ClusterIP
  selector:
    app: kk-payments
  ports:
    - name: http
      protocol: TCP
      port: 3001
      targetPort: 3001
