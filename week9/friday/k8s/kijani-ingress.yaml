apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kijani-ingress
  namespace: kijani-project
  annotations:
    # Strip the /api or /payments prefix before forwarding to the backend.
    # The (.*) is captured as $2 by the regex paths below.
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: kijani.local
      http:
        paths:
          # /api -> kk-api Service (port 8080 -> nginx containerPort 80)
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: kk-api
                port:
                  number: 8080
          # /payments -> kk-payments Service (ClusterIP port 3001).
          # NOTE: the brief's "3000" is a typo; the kk-payments Service listens on 3001.
          - path: /payments(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: kk-payments
                port:
                  number: 3001
