---
- name: Configure KijaniKiosk servers
  hosts: kijanikiosk
  become: true
  become_method: sudo

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart service
      ansible.builtin.systemd:
        name: "{{ service_name }}.service"
        state: restarted
      # Only restart a service that was already enabled by a previous run.
      # On a first-ever run the unit doesn't exist yet when service_facts was
      # gathered, so this is skipped - "Enable service" below does the initial
      # start instead. This avoids a redundant restart racing the first start.
      when: (service_name ~ '.service') in ansible_facts.services

    - name: Restart journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted

  tasks:
    - name: Gather current service facts
      ansible.builtin.service_facts: {}

    # --- PHASE 1: PACKAGES ---
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - acl
          - ufw
          - rsyslog
          - logrotate
        state: present
        install_recommends: false

    # --- PHASE 2: SERVICE ACCOUNTS ---
    - name: Create kijanikiosk system group
      ansible.builtin.group:
        name: "{{ service_group }}"
        state: present
        system: true

    - name: Create service account
      ansible.builtin.user:
        name: "{{ service_name }}"
        group: "{{ service_group }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ base_dir }}/{{ service_name }}"
        create_home: false
        comment: "KijaniKiosk {{ service_name }} service account"

    # --- PHASE 3: DIRECTORIES ---
    - name: Create application directory tree
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ service_group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ base_dir }}", owner: "root", mode: "0755" }
        - { path: "{{ base_dir }}/config", owner: "root", mode: "0750" }
        - { path: "{{ base_dir }}/{{ service_name }}", owner: "{{ service_name }}", mode: "0750" }
        - { path: "{{ log_dir }}", owner: "{{ service_name }}", mode: "02750" }

    # --- PHASE 4: SYSTEMD UNIT FILE ---
    - name: Deploy systemd unit file
      ansible.builtin.template:
        src: templates/service.unit.j2
        dest: "/etc/systemd/system/{{ service_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart service

    - name: Enable service
      ansible.builtin.systemd:
        name: "{{ service_name }}.service"
        enabled: true
        state: started
        daemon_reload: true

    # --- PHASE 5: FIREWALL ---
    - name: Set ufw default deny incoming
      community.general.ufw:
        state: enabled
        default: deny
        direction: incoming

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow service port
      community.general.ufw:
        rule: allow
        interface: lo
        direction: in
        port: "{{ service_port }}"
        proto: tcp

    # --- PHASE 6: JOURNAL PERSISTENCE ---
    - name: Create persistent journal directory
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        mode: "0755"
      notify: Restart journald

    - name: Create journald conf.d directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        mode: "0755"

    - name: Deploy persistent journald configuration
      ansible.builtin.template:
        src: templates/journald.conf.j2
        dest: /etc/systemd/journald.conf.d/kijanikiosk.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart journald

    # --- PHASE 7: LOGROTATE ---
    - name: Deploy logrotate configuration
      ansible.builtin.template:
        src: templates/logrotate.j2
        dest: /etc/logrotate.d/kijanikiosk
        owner: root
        group: root
        mode: "0644"
